[build]
  base    = "frontend/dashboard"
  command = "npm run build"
  publish = "frontend/dashboard/dist"

[build.environment]
  NODE_VERSION = "20"

# SPA routing — all routes fall back to index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Cache hashed assets forever
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
